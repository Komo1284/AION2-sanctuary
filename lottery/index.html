<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경품 추첨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lottery.css">
</head>
<body>

<header class="lt-header">
  <h1 class="lt-title" id="ltTitle"><span class="lt-title-icon">🎁</span> <span class="lt-title-text">경품 추첨</span></h1>
  <p class="lt-sub">명단을 올리고 추첨 인원을 정하면 무작위로 당첨자를 뽑습니다</p>
</header>

<main class="lt-main">
  <section class="lt-panel">
    <div class="lt-step">
      <span class="lt-step-no">1</span>
      <div class="lt-step-body">
        <h2>명단 양식 받기</h2>
        <p>이름과 전화번호를 입력하는 엑셀 양식입니다.</p>
        <button class="lt-btn" id="btnTemplate">⬇ 양식 다운로드</button>
      </div>
    </div>
    <div class="lt-step">
      <span class="lt-step-no">2</span>
      <div class="lt-step-body">
        <h2>명단 업로드</h2>
        <p>작성한 양식 파일(.xlsx)을 올려주세요.</p>
        <label class="lt-btn lt-btn-primary">
          ⬆ 엑셀 업로드
          <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
        </label>
        <span class="lt-file" id="fileName"></span>
      </div>
    </div>
    <div class="lt-step">
      <span class="lt-step-no">3</span>
      <div class="lt-step-body">
        <h2>추첨하기</h2>
        <div class="lt-draw-row">
          <label>추첨 인원 <input type="number" id="drawCount" min="1" value="1"> 명</label>
          <label class="lt-check"><input type="checkbox" id="oneByOne" checked> 한 명씩 공개</label>
        </div>
        <button class="lt-btn lt-btn-draw" id="btnDraw" disabled>추첨 시작</button>
      </div>
    </div>
  </section>

  <section class="lt-stage" id="stage">
    <div class="lt-stage-idle" id="stageIdle">명단을 업로드하면 추첨을 시작할 수 있습니다</div>
    <div class="lt-roller" id="roller" hidden>
      <div class="lt-roller-name" id="rollerName"></div>
      <div class="lt-roller-phone" id="rollerPhone"></div>
    </div>
    <div class="lt-winners-wrap" id="winnersWrap" hidden>
      <div class="lt-winners-head">
        <h2>🎉 당첨자 <span id="winnerCount">0</span>명</h2>
        <button class="lt-btn lt-btn-sm" id="btnResult">⬇ 결과 다운로드</button>
      </div>
      <ol class="lt-winners" id="winners"></ol>
    </div>
  </section>

  <section class="lt-panel lt-list-panel">
    <div class="lt-list-head">
      <h2>추첨 대상자 <span id="listCount">0</span>명</h2>
      <label class="lt-check"><input type="checkbox" id="maskPhone" checked> 전화번호 가리기</label>
    </div>
    <div class="lt-list-empty" id="listEmpty">업로드된 명단이 없습니다</div>
    <table class="lt-table" id="listTable" hidden>
      <thead><tr><th>No</th><th>이름</th><th>전화번호</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </section>
</main>

<footer class="lt-footer">
  <span class="lt-mode-dot" id="modeDot"></span>
</footer>

<div class="lt-toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="lottery.js"></script>
</body>
</html>
